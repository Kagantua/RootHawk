name: Build RootHawk Multi-Arch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64, 386]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p bin
        OUTPUT_NAME="RootHawk-${{ matrix.goarch }}"
        go build -ldflags="-s -w" -o bin/$OUTPUT_NAME roothawk.go
        echo "Built: bin/$OUTPUT_NAME"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RootHawk-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/RootHawk-${{ matrix.goarch }}

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/RootHawk-${{ matrix.goarch }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
